name: ORIO qualification
on:
  pull_request:
  push:
    branches: [main, codex/orio-spc-3]
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            services/control-foundation/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: contracts
      - run: npm ci --ignore-scripts
        working-directory: services/control-foundation
      - run: npm run typecheck
        working-directory: services/control-foundation
      - run: ../services/control-foundation/node_modules/.bin/tsc --strict --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext scripts/prepare-sepolia-deployment.ts scripts/submit-sepolia-timelock.ts
        working-directory: contracts
      - run: npm run test:provider-session
        working-directory: services/control-foundation
      - run: npm run test:local
        working-directory: services/control-foundation
      - run: npm test
        working-directory: contracts
      - run: npm run test:container
        working-directory: services/control-foundation
      - run: python3 -m unittest discover -p 'test_*.py'
        working-directory: packages/monetary-reference
