name: ORIO qualification
on:
  pull_request:
  push:
    branches: [main, codex/orio-spc-3]
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash -n infrastructure/aws/build-hosted-audit-inputs.sh
      - run: bash -n infrastructure/aws/build-sql-qualification-inputs.sh
      - run: bash -n infrastructure/aws/build-valuation-journal-qualification-inputs.sh
      - run: bash -n infrastructure/aws/build-original-journal-inputs.sh
      - run: bash -n infrastructure/aws/build-original-maintenance-inputs.sh
      - run: bash -n infrastructure/aws/build-autonomous-qualification-inputs.sh
      - run: bash -n infrastructure/aws/build-original-autonomous-inputs.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            services/control-foundation/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: contracts
      - run: npm ci --ignore-scripts
        working-directory: services/control-foundation
      - run: node --check scripts/verify-clone-journal-grants.mjs
        working-directory: services/control-foundation
      - run: npm run typecheck
        working-directory: services/control-foundation
      - run: bash infrastructure/aws/build-autonomous-qualification-inputs.sh "$ORIO_SOURCE_COMMIT"
        env:
          ORIO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash infrastructure/aws/build-original-autonomous-inputs.sh "$ORIO_SOURCE_COMMIT"
        env:
          ORIO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node scripts/qualify-valuation-worker-package.mjs
        working-directory: contracts
      - run: node scripts/build-metadata-lambda.mjs /tmp/orio-metadata-qualification.zip
        working-directory: services/control-foundation
      - run: node scripts/build-valuation-journal-lambda.mjs /tmp/orio-valuation-journal-qualification.zip
        working-directory: services/control-foundation
      - run: >-
          node --input-type=module -e
          "import fs from 'node:fs';import assert from 'node:assert/strict';const built=JSON.parse(fs.readFileSync('/tmp/orio-valuation-journal-qualification.zip.json','utf8'));const plan=JSON.parse(fs.readFileSync('infrastructure/aws/valuation-journal-private-lambda.json','utf8'));assert.equal(built.codeSha256Base64,plan.Resources.JournalVersion.Properties.CodeSha256);"
      - run: node node_modules/typescript/bin/tsc --ignoreConfig --strict --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions scripts/audit-hosted-schema.ts
        working-directory: services/control-foundation
      - run: ../services/control-foundation/node_modules/.bin/tsc --strict --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext scripts/prepare-sepolia-deployment.ts scripts/submit-sepolia-timelock.ts scripts/verify-sepolia-timelock.ts
        working-directory: contracts
      - run: ../services/control-foundation/node_modules/.bin/tsc --strict --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions scripts/prepare-remaining-sepolia.ts scripts/execute-remaining-sepolia.ts scripts/verify-remaining-sepolia.ts
        working-directory: contracts
      - run: npm run test:provider-session
        working-directory: services/control-foundation
      - run: npm run test:local
        working-directory: services/control-foundation
      - run: npm test
        working-directory: contracts
      - run: npm run test:container
        working-directory: services/control-foundation
      - run: python3 -m unittest discover -p 'test_*.py'
        working-directory: packages/monetary-reference
